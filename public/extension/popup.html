<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>بصيرة — التحقق والسياق</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .logo {
      font-weight: 700;
      color: #10b981;
      font-size: 16px;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 9999px;
      background: #1e293b;
      color: #94a3b8;
    }
    .term-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .label {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .term-title {
      font-weight: 600;
      font-size: 14px;
      color: #38bdf8;
    }
    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
      margin-bottom: 8px;
    }
    .status-matched { background: #064e3b; color: #6ee7b7; border: 1px solid #059669; }
    .status-review { background: #78350f; color: #fde68a; border: 1px solid #d97706; }
    .status-notfound { background: #374151; color: #d1d5db; border: 1px solid #6b7280; }
    .status-referral { background: #4c1d95; color: #ddd6fe; border: 1px solid #7c3aed; }
    .warning {
      background: #451a03;
      border-right: 3px solid #f59e0b;
      padding: 8px;
      margin-top: 8px;
      font-size: 11px;
      color: #fef3c7;
      border-radius: 4px;
    }
    .source-box {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #334155;
      font-size: 11px;
      color: #94a3b8;
    }
    .btn {
      width: 100%;
      background: #059669;
      color: white;
      border: none;
      padding: 7px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn:hover { background: #10b981; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">بصيرة — Baseera</div>
    <span class="badge">طبقة التحقق والسياق</span>
  </div>

  <div id="loading" style="display:none; text-align:center; padding: 12px; color: #94a3b8;">
    جاري استرجاع السند من المصادر المعتمدة...
  </div>

  <div id="content">
    <div class="term-box">
      <div class="label">النص أو المصطلح المحدد:</div>
      <div class="term-title" id="selected-text">Sharia</div>
    </div>

    <div id="status-container"></div>
    <div id="meaning-container"></div>
    <div id="warning-container"></div>
    <div id="source-container"></div>

    <button class="btn" id="check-btn">إعادة التحقق من التحديد</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
